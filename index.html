<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OTIVO AI CLOUD</title>
    <meta name="description" content="OTIVO AI CLOUD automated Deriv options trading terminal with live API token balance, automatic Real and Demo account detection, hybrid strategies, martingale, and virtual loss filtering." />
    <meta property="og:title" content="OTIVO AI CLOUD" />
    <meta property="og:description" content="OTIVO AI CLOUD automated Deriv options trading terminal with live API token balance, automatic Real and Demo account detection, hybrid strategies, martingale, and virtual loss filtering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #preloader {
        --bg: #04060f;
        --c1: #00e5ff;
        --c2: #2f6bff;
        --c3: #7b5cff;
        --logo-w: clamp(240px, min(86vw, 81vh, 1100px), 1100px);
        --ring: min(calc(var(--logo-w) * 1.15), 96vmin);
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        contain: strict;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #fff;
      }
      @supports (height: 100dvh) {
        #preloader {
          --logo-w: clamp(240px, min(86vw, 81dvh, 1100px), 1100px);
        }
      }
      body.otivo-preloading {
        overflow: hidden;
        height: 100%;
        background: #04060f;
      }
      body.otivo-preloading #root {
        opacity: 0;
      }
      #preloader *, #preloader *::before, #preloader *::after {
        box-sizing: border-box;
      }
      #preloader .half {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50.2%;
        background: var(--bg);
        will-change: transform;
      }
      #preloader .half.top { top: 0; }
      #preloader .half.bottom { bottom: 0; }
      #preloader .bg-layer {
        position: absolute;
        inset: -5%;
        pointer-events: none;
        will-change: transform;
      }
      #preloader .glow {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
      }
      #preloader .g1 {
        width: 90vmax;
        height: 90vmax;
        left: -35vmax;
        top: -35vmax;
        background: radial-gradient(circle, rgba(123, 92, 255, .5), transparent 65%);
      }
      #preloader .g2 {
        width: 80vmax;
        height: 80vmax;
        right: -30vmax;
        bottom: -30vmax;
        background: radial-gradient(circle, rgba(0, 229, 255, .38), transparent 65%);
      }
      #preloader .g3 {
        width: 60vmax;
        height: 60vmax;
        left: 20vw;
        top: 25vh;
        background: radial-gradient(circle, rgba(47, 107, 255, .3), transparent 65%);
      }
      #preloader .grid {
        position: absolute;
        left: -50%;
        bottom: -25%;
        width: 200%;
        height: 80%;
        opacity: .35;
        background-image:
          linear-gradient(rgba(0, 229, 255, .3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 229, 255, .3) 1px, transparent 1px);
        background-size: clamp(40px, 7vmin, 96px) clamp(40px, 7vmin, 96px);
        transform: perspective(500px) rotateX(62deg);
      }
      #preloader .grid-fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, var(--bg) 35%, transparent 80%);
      }
      #preloader .particle {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        will-change: transform, opacity;
        opacity: 0;
      }
      #preloader .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) max(5vw, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(5vw, env(safe-area-inset-left));
        will-change: transform;
      }
      #preloader .logo-wrap {
        position: relative;
        width: var(--logo-w);
        aspect-ratio: 7 / 2.4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #preloader .halo {
        position: absolute;
        inset: 0;
        margin: auto;
        width: calc(var(--logo-w) * 1.5);
        height: calc(var(--logo-w) * 1.5);
        max-width: 150vmin;
        max-height: 150vmin;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 229, 255, .22), rgba(123, 92, 255, .12) 40%, transparent 68%);
        will-change: transform, opacity;
      }
      #preloader .ring {
        position: absolute;
        inset: 0;
        margin: auto;
        width: var(--ring);
        height: var(--ring);
        pointer-events: none;
        will-change: transform, opacity;
      }
      #preloader .ring.s2 {
        width: calc(var(--ring) * .84);
        height: calc(var(--ring) * .84);
      }
      #preloader .ring.s3 {
        width: calc(var(--ring) * .68);
        height: calc(var(--ring) * .68);
      }
      #preloader svg.logo {
        width: 100%;
        height: auto;
        overflow: visible;
        position: relative;
        will-change: transform, opacity;
      }
      #preloader .logo text {
        font-family: 'Arial Black', Gadget, sans-serif;
        font-size: 150px;
        font-weight: 900;
        letter-spacing: 6px;
      }
      #preloader #stroke-text {
        fill: none;
        stroke: url(#grad);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
      }
      #preloader #fill-text {
        fill: url(#grad);
        opacity: 0;
      }
      #preloader .sub {
        display: flex;
        gap: .2em;
        margin-top: clamp(2px, 1vh, 12px);
        font-weight: 700;
        letter-spacing: .35em;
        font-size: clamp(13px, calc(var(--logo-w) * .05), 38px);
        white-space: nowrap;
      }
      #preloader .sub span {
        display: inline-block;
        opacity: 0;
        will-change: transform, opacity;
      }
      #preloader .sub .gap {
        width: .6em;
      }
      #preloader .loader {
        width: clamp(220px, calc(var(--logo-w) * .8), 560px);
        margin-top: clamp(18px, 4.5vh, 48px);
        will-change: transform, opacity;
      }
      #preloader .bar {
        position: relative;
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, .1);
        overflow: hidden;
      }
      #preloader .bar-fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
        border-radius: 99px;
        background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
        will-change: transform;
      }
      #preloader .bar-shine {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 70px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .65), transparent);
        transform: translateX(-80px);
        will-change: transform;
      }
      #preloader .meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 12px;
        font-size: clamp(11px, calc(var(--logo-w) * .026), 16px);
        letter-spacing: .08em;
        color: rgba(255, 255, 255, .7);
      }
      #preloader #status {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-right: 12px;
      }
      #preloader #pct {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: clamp(15px, calc(var(--logo-w) * .04), 22px);
        color: var(--c1);
      }
      #preloader .flash {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 140vmax;
        height: 140vmax;
        margin: -70vmax 0 0 -70vmax;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255, 255, 255, .9), rgba(0, 229, 255, .55) 30%, transparent 65%);
        will-change: transform, opacity;
      }
      @media (max-width: 360px) {
        #preloader .sub { letter-spacing: .25em; }
        #preloader .meta { letter-spacing: .04em; }
      }
      @media (max-height: 480px) and (orientation: landscape) {
        #preloader .loader { margin-top: 14px; }
        #preloader .sub { margin-top: 0; }
        #preloader .bar { height: 5px; }
        #preloader .meta { margin-top: 8px; }
      }
      @media (min-width: 768px) {
        #preloader .bar { height: 7px; }
      }
      @media (min-width: 1600px) {
        #preloader .bar { height: 9px; }
        #preloader .meta { margin-top: 16px; }
      }
    </style>
  </head>
  <body class="otivo-preloading bg-[#0B0F17] text-slate-100 antialiased selection:bg-blue-600/30 selection:text-white">
    <div id="root"></div>

    <!-- OTIVO AI CLOUD Preloader -->
    <div id="preloader" role="status" aria-label="Loading OTIVO AI CLOUD">
      <div class="half top"></div>
      <div class="half bottom"></div>

      <div class="bg-layer" id="bgLayer">
        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <div class="glow g3"></div>
        <div class="grid"></div>
        <div class="grid-fade"></div>
        <div id="particles"></div>
      </div>

      <div class="stage" id="stage">
        <div class="logo-wrap">
          <div class="halo" id="halo"></div>

          <svg class="ring" id="r1" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="#00e5ff" stroke-width=".35" stroke-dasharray="18 8 3 8" stroke-linecap="round"/></svg>
          <svg class="ring s2" id="r2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="#7b5cff" stroke-width=".3" stroke-dasharray="1 3" stroke-linecap="round"/></svg>
          <svg class="ring s3" id="r3" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="#2f6bff" stroke-width=".4" stroke-dasharray="30 12" stroke-linecap="round"/></svg>

          <svg class="logo" viewBox="0 0 700 200" id="logo">
            <defs>
              <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="580" y2="0">
                <stop offset="0" stop-color="#00e5ff"/>
                <stop offset=".5" stop-color="#2f6bff"/>
                <stop offset="1" stop-color="#7b5cff"/>
              </linearGradient>
            </defs>
            <text id="fill-text" x="350" y="105" text-anchor="middle" dominant-baseline="middle">OTIVO</text>
            <text id="stroke-text" x="350" y="105" text-anchor="middle" dominant-baseline="middle">OTIVO</text>
          </svg>
        </div>

        <div class="sub" id="sub" aria-hidden="true"></div>

        <div class="loader" id="loader">
          <div class="bar"><div class="bar-fill" id="barFill"></div><div class="bar-shine" id="barShine"></div></div>
          <div class="meta"><span id="status">Initializing neural core…</span><span id="pct">0%</span></div>
        </div>
      </div>

      <div class="flash" id="flash"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
